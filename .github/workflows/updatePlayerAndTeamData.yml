name: Automate Team and Player Data Update

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:      # Allows manual trigger

jobs:
  run-python-script:
    runs-on: ubuntu-latest  # Use a virtual Ubuntu machine

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4  # Pulls your repository code

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Scripts/Team_Player/requirements.txt

      - name: Debug environment variables
        run: |
          echo "DB_HOST is set: ${{ !env.DB_HOST == '' }}"
          echo "DB_PORT is set: ${{ !env.DB_PORT == '' }}"
          echo "DB_NAME is set: ${{ !env.DB_NAME == '' }}"
          echo "DB_USER is set: ${{ !env.DB_USER == '' }}"
          echo "Length of DB_HOST: ${#DB_HOST}"
          echo "Length of DB_PORT: ${#DB_PORT}"

      - name: 🏃 Run the Script
        env:
            DB_NAME: ${{ secrets.DB_NAME }}
            DB_USER: ${{ secrets.DB_USER }}
            DB_HOST: ${{ secrets.DB_HOST }}
            DB_PORT: ${{ secrets.DB_PORT }}
            DB_PASS: ${{ secrets.DB_PASS }}
        run: |
            python Scripts/Team_Player/main.py

      - name: ✅ Success Notification
        if: success()
        run: echo "Script ran successfully!"

      - name: ❌ Failure Notification
        if: failure()
        run: echo "Script failed to run!"
